<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusPulse | Smart Study Planner</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
 --purple:#6425df;
 --purple2:#8b45f2;
 --ink:#17172f;
 --muted:#77788f;
 --line:#ecebfa;
 --bg:#f7f6ff;
}

*{box-sizing:border-box;scroll-behavior:smooth}

body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 transition:background .25s,color .25s;
}

button,a{-webkit-tap-highlight-color:transparent}

.sidebar{
 position:fixed;
 inset:0 auto 0 0;
 width:270px;
 background:#fff;
 border-right:1px solid var(--line);
 padding:25px 18px;
 z-index:20;
 display:flex;
 flex-direction:column;
}

.brand-icon{
 width:48px;height:48px;
 border-radius:16px;
 background:linear-gradient(135deg,#7426e8,#a855f7);
 color:white;
 display:grid;
 place-items:center;
 box-shadow:0 8px 18px #7426e833;
}

.nav-label{
 font-size:10px;
 font-weight:800;
 letter-spacing:1.5px;
 color:#a3a0b8;
 padding:0 12px;
 margin:27px 0 10px;
}

/* PROFESSIONAL ACTIVE ICON EFFECT */
.nav-item{
 position:relative;
 display:flex;
 align-items:center;
 gap:14px;
 width:100%;
 padding:10px 14px;
 margin:5px 0;
 border-radius:15px;
 color:#68677e;
 text-decoration:none;
 font-size:13px;
 font-weight:650;
 transition:all .25s ease;
}

.nav-item .nav-icon{
 width:38px;
 height:38px;
 border-radius:12px;
 display:grid;
 place-items:center;
 font-size:16px;
 transition:all .25s ease;
}

.nav-item:hover{
 background:#f7f3ff;
 color:var(--purple);
 transform:translateX(3px);
}

.nav-item.active{
 background:linear-gradient(105deg,#f0e5ff,#f8f2ff);
 color:var(--purple);
 box-shadow:0 7px 18px #702be90d;
}

.nav-item.active:before{
 content:"";
 position:absolute;
 left:0;
 top:12px;
 bottom:12px;
 width:4px;
 border-radius:0 6px 6px 0;
 background:linear-gradient(#6425df,#a855f7);
}

.nav-item.active .nav-icon{
 background:linear-gradient(135deg,#6c25e5,#a34cf2);
 color:white;
 box-shadow:0 5px 12px #702be944;
 transform:scale(1.07);
}

.nav-item:not(.active) .nav-icon{
 background:#f6f5fb;
 color:#77758d;
}

.nav-item:active .nav-icon{
 transform:scale(.91);
}

.encourage{
 margin-top:auto;
 border-radius:18px;
 padding:17px 14px;
 background:linear-gradient(125deg,#ead7ff,#f5eaff);
 color:#4e1aa9;
}

.topbar{
 min-height:78px;
 background:#fff;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 padding:16px 34px;
 position:sticky;
 top:0;
 z-index:10;
}

.main{margin-left:270px;min-height:100vh}
.page{max-width:1400px;margin:auto;padding:30px 34px 55px}

.card{
 background:white;
 border:1px solid var(--line);
 border-radius:22px;
 box-shadow:0 7px 25px #29205b08;
}

.stat-card{
 padding:20px;
 display:flex;
 align-items:center;
 gap:14px;
}

.stat-icon{
 width:46px;
 height:46px;
 border-radius:15px;
 display:grid;
 place-items:center;
 font-size:19px;
}

.input{
 width:100%;
 padding:12px 13px;
 border:1px solid #e7e5f1;
 border-radius:11px;
 background:#fff;
 color:#27243e;
 font-size:13px;
 outline:none;
}

.input:focus{
 border-color:#8b45f2;
 box-shadow:0 0 0 3px #8b45f21a;
}

.btn{
 border:0;
 background:linear-gradient(100deg,#6425df,#9145ed);
 color:#fff;
 padding:12px 17px;
 border-radius:12px;
 font-size:13px;
 font-weight:750;
 cursor:pointer;
 box-shadow:0 6px 14px #702be922;
 transition:.2s;
}

.btn:hover{transform:translateY(-2px)}

.btn-light{
 border:1px solid #e8e5f3;
 background:#fff;
 color:#55516e;
 padding:10px 13px;
 border-radius:11px;
 font-size:12px;
 font-weight:700;
 cursor:pointer;
}

.quick-tile{
 border-radius:19px;
 padding:18px 12px;
 text-align:center;
 cursor:pointer;
 transition:.22s;
 border:1px solid transparent;
}

.quick-tile:hover{
 transform:translateY(-4px);
 box-shadow:0 10px 20px #25204412;
}

.quick-tile:active{transform:scale(.97)}

.subject-row{
 display:grid;
 grid-template-columns:1fr 78px 100px 28px;
 gap:8px;
 align-items:center;
}

.progress{
 height:9px;
 background:#efedf6;
 border-radius:30px;
 overflow:hidden;
}

.progress>div{
 height:100%;
 background:linear-gradient(90deg,#6425df,#a855f7);
 border-radius:30px;
 transition:width .3s;
}

.task-done{
 accent-color:#6425df;
 width:17px;
 height:17px;
}

.day-card{
 border:1px solid #eeecf5;
 border-radius:15px;
 padding:15px;
}

.day-card summary{
 cursor:pointer;
 list-style:none;
}

.day-card summary::-webkit-details-marker{display:none}

.developer-credit{
 font-size:11px;
 font-weight:750;
 white-space:nowrap;
}

.aaditya{
 background:linear-gradient(90deg,#6425df,#a855f7);
 background-clip:text;
 color:transparent;
}

.akshat{
 background:linear-gradient(90deg,#2563eb,#06b6d4);
 background-clip:text;
 color:transparent;
}

.mobile-menu{display:none}

.dark{
 --bg:#111827;
 --ink:#f2efff;
 --muted:#b9b4ce;
 --line:#343149;
}

.dark .sidebar,
.dark .topbar,
.dark .card,
.dark .btn-light{
 background:#1e1b2d;
 border-color:#343149;
 color:#f2efff;
}

.dark .nav-item{color:#c7c1dc}

.dark .nav-item.active{
 background:#38265c;
 color:#e5d4ff;
}

.dark .nav-item:not(.active) .nav-icon{
 background:#2b273d;
 color:#c9c1df;
}

.dark .encourage{
 background:#38265c;
 color:#eadcff;
}

.dark .input{
 background:#242036;
 color:#fff;
 border-color:#45405b;
}

.dark .text-gray-400,
.dark .text-gray-500,
.dark .text-gray-600,
.dark .text-gray-700{
 color:#b9b4ce!important;
}

.dark .day-card{border-color:#39344f}
.dark .progress{background:#38334b}

@media(max-width:950px){
 .sidebar{width:235px}
 .main{margin-left:235px}
 .topbar{padding:14px 20px}
 .page{padding:24px 20px}
}

@media(max-width:720px){
 .sidebar{
  transform:translateX(-105%);
  transition:.25s;
  width:270px;
  box-shadow:12px 0 30px #17102b20;
 }
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0}
 .mobile-menu{display:inline-grid;place-items:center}
 .topbar{padding:13px 16px}
 .page{padding:20px 14px 45px}
 .developer-credit{display:none}
}

@media(max-width:520px){
 .subject-row{grid-template-columns:1fr 58px 82px 24px}
 .top-actions .btn-light{padding:9px}
 .welcome-title{font-size:27px}
 .stat-card{padding:14px;gap:9px}
 .stat-icon{width:38px;height:38px}
}

@media print{
 .sidebar,.topbar,.no-print{display:none!important}
 .main{margin:0}
 .page{padding:0}
 .card{box-shadow:none;break-inside:avoid}
 body{background:white;color:#111}
}
</style>
</head>

<body>

 <div class="flex items-center gap-3 px-2">

   <i class="fa-solid fa-graduation-cap text-2xl"></i>
  </div>
  <div>
   <div class="font-extrabold text-xl tracking-tight">
    Campus<span style="color:#7426e8">Pulse</span>

   <p class="text-xs text-gray-400">Learn · Plan · Achieve</p>
  </div>
 </div>

 <div class="nav-label">YOUR WORKSPACE</div>

 <nav id="sideNav">
  <a href="#dashboard" class="nav-item active">
   <span class="nav-icon"><i class="fa-solid fa-house"></i></span>

  </a>

  <a href="#configuration" class="nav-item">
   <span class="nav-icon"><i class="fa-solid fa-sliders"></i></span>

  </a>

  <a href="#schedule" class="nav-item">
   <span class="nav-icon"><i class="fa-solid fa-calendar-check"></i></span>

  <a href="#revision" class="nav-item">
   <span class="nav-icon"><i class="fa-solid fa-arrows-rotate"></i></span>

  </a>

  <a href="#weekly" class="nav-item">
   <span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span>

  <a href="#personalNotes" class="nav-item">
   <span class="nav-icon"><i class="fa-solid fa-note-sticky"></i></span>

 </nav>

 <div class="encourage">
