<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Smart Time Table & Exam Prep Scheduler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-border { border: 1px solid #cbd5e1 !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">CampusPulse</h1>
                    <p class="text-xs text-slate-400">Smart Exam Prep & Scheduler</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="loadPresetData()" class="px-3 py-1.5 bg-indigo-600/20 border border-indigo-500/30 hover:bg-indigo-600/30 text-indigo-300 text-xs font-medium rounded-lg transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Load BCA Demo</span>
                </button>
                <button onclick="window.print()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition" title="Print / Export Schedule">
                    <i class="fa-solid fa-print"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Grid Layout: Form vs Dashboard -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Setup Form -->
            <div class="lg:col-span-1 space-y-6 no-print">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-semibold text-lg flex items-center space-x-2">
                            <i class="fa-solid fa-sliders text-indigo-400"></i>
                            <span>Exam Configuration</span>
                        </h2>
                    </div>

                    <form id="schedulerForm" onsubmit="generateSchedule(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Target Exam Name</label>
                            <input type="text" id="examName" required placeholder="e.g., BCA Semester Exams" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Target Date</label>
                                <input type="date" id="examDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Daily Study Hours</label>
                                <input type="number" id="dailyHours" min="1" max="16" value="5" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                            </div>
                        </div>

                        <div class="border-t border-slate-800 pt-4">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-medium text-slate-400">Subjects & Chapters</label>
                                <button type="button" onclick="addSubjectRow()" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium flex items-center space-x-1">
                                    <i class="fa-solid fa-plus"></i> <span>Add Subject</span>
                                </button>
                            </div>
                            
                            <div id="subjectsContainer" class="space-y-3 max-h-64 overflow-y-auto pr-1">
                                <!-- Dynamic Rows injected here -->
                            </div>
                        </div>

                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-bolt"></i>
                            <span>Generate Smart Schedule</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Results & Analytics -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Overview Stats Cards -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400">Days Remaining</p>
                        <h3 id="statDays" class="text-2xl font-bold text-indigo-400 mt-1">--</h3>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400">Total Subjects</p>
                        <h3 id="statSubjects" class="text-2xl font-bold text-cyan-400 mt-1">--</h3>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400">Total Topics</p>
                        <h3 id="statTopics" class="text-2xl font-bold text-emerald-400 mt-1">--</h3>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400">Readiness Score</p>
                        <h3 id="statScore" class="text-2xl font-bold text-amber-400 mt-1">0%</h3>
                    </div>
                </div>

                <!-- Visual Chart Section -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl no-print">
                    <h3 class="font-semibold text-sm text-slate-300 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-chart-pie text-cyan-400"></i>
                        <span>Time Allocation per Subject (Hours)</span>
                    </h3>
                    <div class="relative h-64 w-full flex items-center justify-center">
                        <canvas id="prepChart"></canvas>
                    </div>
                </div>

                <!-- Daily Breakdown Schedule View -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-semibold text-base flex items-center space-x-2">
                            <i class="fa-solid fa-calendar-days text-indigo-400"></i>
                            <span id="scheduleTitle">Generated Study Routine</span>
                        </h3>
                        <span id="totalHoursAllocated" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">Total Hours: 0h</span>
                    </div>

                    <div id="scheduleOutput" class="space-y-4">
                        <div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                            <i class="fa-solid fa-clipboard-list text-3xl mb-2"></i>
                            <p class="text-sm">Configure subjects and click <b class="text-slate-400">"Generate Smart Schedule"</b></p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Script Logic -->
    <script>
        let chartInstance = null;

        function addSubjectRow(name = '', chapters = 5, difficulty = 'Medium') {
            const container = document.getElementById('subjectsContainer');
            const row = document.createElement('div');
            row.className = 'flex items-center space-x-2 bg-slate-950 p-2.5 border border-slate-800 rounded-xl';
            row.innerHTML = `
                <input type="text" placeholder="Subject Name" value="${name}" required class="subject-name w-1/2 bg-transparent border-none text-sm focus:outline-none text-slate-200">
                <input type="number" placeholder="Chapters" min="1" value="${chapters}" required class="subject-chapters w-16 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-center text-slate-200" title="Total Chapters">
                <select class="subject-diff w-24 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200">
                    <option value="Easy" ${difficulty === 'Easy' ? 'selected' : ''}>Easy</option>
                    <option value="Medium" ${difficulty === 'Medium' ? 'selected' : ''}>Medium</option>
                    <option value="Hard" ${difficulty === 'Hard' ? 'selected' : ''}>Hard</option>
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-400 p-1 transition"><i class="fa-solid fa-trash text-xs"></i></button>
            `;
            container.appendChild(row);
        }

        function loadPresetData() {
            document.getElementById('examName').value = "BCA 4th Semester Final Exams";
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 20);
            document.getElementById('examDate').value = targetDate.toISOString().split('T')[0];
            document.getElementById('dailyHours').value = '5';

            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';
            
            addSubjectRow('Java Programming', 8, 'Hard');
            addSubjectRow('Computer Networks', 6, 'Medium');
            addSubjectRow('Data Structures', 7, 'Hard');
            addSubjectRow('Software Engineering', 5, 'Easy');

            document.getElementById('schedulerForm').dispatchEvent(new Event('submit'));
        }

        function generateSchedule(e) {
            e.preventDefault();

            const examName = document.getElementById('examName').value;
            const examDateVal = document.getElementById('examDate').value;
            const dailyHours = parseFloat(document.getElementById('dailyHours').value) || 4;

            const nameInputs = document.querySelectorAll('.subject-name');
            const chapterInputs = document.querySelectorAll('.subject-chapters');
            const diffInputs = document.querySelectorAll('.subject-diff');

            if (nameInputs.length === 0) {
                alert('Please add at least one subject!');
                return;
            }

            let subjects = [];
            let totalChapters = 0;

            for (let i = 0; i < nameInputs.length; i++) {
                const sName = nameInputs[i].value;
                const sChap = parseInt(chapterInputs[i].value) || 1;
                const sDiff = diffInputs[i].value;
                
                let weight = 1.0;
                if (sDiff === 'Medium') weight = 1.3;
                if (sDiff === 'Hard') weight = 1.7;

                subjects.push({ name: sName, chapters: sChap, difficulty: sDiff, weight: weight });
                totalChapters += sChap;
            }

            const today = new Date();
            const target = new Date(examDateVal);
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays <= 0) {
                alert('Exam date must be in the future!');
                return;
            }

            document.getElementById('statDays').innerText = diffDays;
            document.getElementById('statSubjects').innerText = subjects.length;
            document.getElementById('statTopics').innerText = totalChapters;
            document.getElementById('scheduleTitle').innerText = `${examName} - Day-by-Day Schedule`;

            const totalWeight = subjects.reduce((sum, s) => sum + (s.chapters * s.weight), 0);
            
            let totalAllocatedHours = 0;
            let subjectHours = subjects.map(s => {
                const hrs = ((s.chapters * s.weight) / totalWeight) * (diffDays * dailyHours);
                totalAllocatedHours += hrs;
                return { name: s.name, hours: Math.round(hrs * 10) / 10 };
            });

            document.getElementById('totalHoursAllocated').innerText = `Total Study Target: ${Math.round(totalAllocatedHours)} hrs`;

            let outputHTML = '';
            let currentSubjectIndex = 0;
            let chaptersDoneInSub = 0;

            for (let day = 1; day <= Math.min(diffDays, 30); day++) {
                let currentSub = subjects[currentSubjectIndex];

                outputHTML += `
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="bg-indigo-600/20 text-indigo-400 font-bold text-xs px-2.5 py-1.5 rounded-lg border border-indigo-500/30">Day ${day}</span>
                            <div>
                                <h4 class="font-semibold text-sm text-slate-200">${currentSub.name}</h4>
                                <p class="text-xs text-slate-400">Target: Focus on core concepts & problem solving (${dailyHours} hrs)</p>
                            </div>
                        </div>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" onchange="updateProgress()" class="task-check w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500">
                            <span class="text-xs text-slate-400">Done</span>
                        </label>
                    </div>
                `;

                chaptersDoneInSub++;
                if (chaptersDoneInSub >= Math.ceil(currentSub.chapters / 2) && currentSubjectIndex < subjects.length - 1) {
                    currentSubjectIndex++;
                    chaptersDoneInSub = 0;
                }
            }

            document.getElementById('scheduleOutput').innerHTML = outputHTML;
            renderChart(subjectHours);
            updateProgress();
        }

        function renderChart(data) {
            const ctx = document.getElementById('prepChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        data: data.map(d => d.hours),
                        backgroundColor: ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', boxWidth: 12, font: { size: 11 } }
                        }
                    }
                }
            });
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.task-check');
            if (checkboxes.length === 0) return;

            let checkedCount = 0;
            checkboxes.forEach(cb => { if (cb.checked) checkedCount++; });

            const score = Math.round((checkedCount / checkboxes.length) * 100);
            document.getElementById('statScore').innerText = score + '%';
        }

        window.onload = function() {
            loadPresetData();
        };
    </script>
</body>
</html>
